<rect x="58" y="58" width="12" height="16" fill="#C8302F" stroke="#1B1B1B" stroke-width="2.5"/>
<path d="M34 92 66 70H112L130 92Z" fill="#C8302F" stroke="#1B1B1B" stroke-width="3" stroke-linejoin="round"/>
