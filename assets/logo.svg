<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Cabaña Torres, Valle del Potrero">
<style>
.puntada{animation:coser 6s linear infinite}
.humo circle{animation:humo 3.5s ease-in-out infinite}
.humo circle:nth-child(2){animation-delay:.5s}
.humo circle:nth-child(3){animation-delay:1s}
@keyframes coser{to{stroke-dashoffset:-80}}
@keyframes humo{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}
</style>
<circle cx="80" cy="80" r="74" fill="#FFFDF6" stroke="#3E8E2A" stroke-width="8"/>
<circle class="puntada" cx="80" cy="80" r="65" fill="none" stroke="#F4D21F" stroke-width="2.4" stroke-dasharray="2 6" stroke-linecap="round"/>
