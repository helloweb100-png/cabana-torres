<rect x="78" y="102" width="12" height="11" fill="#fff" stroke="#1B1B1B" stroke-width="2"/><rect x="100" y="102" width="12" height="11" fill="#fff" stroke="#1B1B1B" stroke-width="2"/>
<g fill="#A87B50" stroke="#1B1B1B" stroke-width="2"><ellipse cx="29" cy="107" rx="11" ry="8"/><circle cx="39" cy="100" r="5"/><path d="M37 96 35 82Q40 80 41 94ZM41 95 45 83Q50 84 46 97Z"/></g>
